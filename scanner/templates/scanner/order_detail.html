{% extends 'scanner/base.html' %}
{% block title %}{{ order }}{% endblock %}
{% block content %}
<h1>Заказ {{ order.order_number }}</h1>
<p>{{ order.full_name }}</p>
<p>Статус: {{ order.get_status_display }}</p>

<h3>Загрузить спецификацию</h3>
<form method="post" enctype="multipart/form-data" action="{% url 'order_import' order.id %}">
    {% csrf_token %}
    <div class="mb-3">
        <input type="file" name="file" accept=".xlsx,.xls" required class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Загрузить</button>
</form>

<a href="{% url 'order_tree' order.id %}" class="btn btn-outline-secondary mt-3">Дерево заказа</a>
{% endblock %}
